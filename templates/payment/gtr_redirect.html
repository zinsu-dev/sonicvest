<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to GTR Bank...</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-design-system.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <style>
        body{background:#0F1115;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
        .wrap{text-align:center;max-width:400px;padding:20px}
        .spin{width:40px;height:40px;border:3px solid rgba(212,175,55,0.2);border-left:3px solid #D4AF37;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
        @keyframes spin{to{transform:rotate(360deg)}}
        h3{margin:0 0 8px;font-weight:700}
        p{color:#B3B8C4;margin:0 0 20px;font-size:14px}
        .details{background:#20232A;border-radius:12px;padding:16px;margin-bottom:20px;border:1px solid #2C313A}
        .row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
        .row .lbl{color:#B3B8C4}
        .row .val{font-weight:700}
        .link{display:none;margin-top:16px}
        .link a{color:#D4AF37;text-decoration:none;font-weight:700}
    </style>
</head>
<body>
    <div class="wrap">
        <div class="spin"></div>
        <h3>Redirecting to GTR Bank</h3>
        <p>Please wait while we redirect you to the secure payment gateway...</p>
        <div class="details">
            <div class="row"><span class="lbl">Reference:</span><span class="val">{{ reference }}</span></div>
            <div class="row"><span class="lbl">Amount:</span><span class="val">₦{{ amount | format_number }}</span></div>
        </div>
        <div class="link" id="manual-link-container">
            <a href="{{ payment_url }}" target="_blank">Click here if not redirected automatically</a>
        </div>
    </div>

    <script>
        // Auto-redirect to payment URL
        setTimeout(function() {
            window.location.href = '{{ payment_url }}';
        }, 3000);
        
        // Show manual link after 8 seconds
        setTimeout(function() {
            document.getElementById('manual-link-container').style.display = 'block';
        }, 8000);
        
        // Fallback: If still on page after 15 seconds, show error
        setTimeout(function() {
            if (document.visibilityState === 'visible') {
                document.querySelector('.loader-content').innerHTML += 
                    '<div class="redirect-error">' +
                    '<p style="color: #ff6b6b; margin-top: 20px;">Automatic redirect failed.</p>' +
                    '<a href="{{ payment_url }}" class="btn-primary" target="_blank">Continue to Payment</a>' +
                    '</div>';
            }
        }, 15000);
    </script>

    <style>
        .payment-details {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 14px;
        }
        
        .detail-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .detail-label {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .detail-value {
            color: #fff;
            font-weight: bold;
        }
        
        .manual-link {
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px 20px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .manual-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .redirect-error {
            margin-top: 20px;
            text-align: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #D4AF37 0%, #E5C158 40%, #C89B3C 100%);
            color: #fff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: #C89B3C;
            transform: translateY(-2px);
        }
    </style>    
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

</body>
</html>
