<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - Brooklyn</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root{--bg:#0F1115;--surface:#181A20;--card:#20232A;--border:#2C313A;--text:#F8FAFC;--muted:#B3B8C4;--gold:#D4AF37;--gold-light:#E5C158;--gold-dark:#C89B3C;--success:#22C55E;--danger:#EF4444;--gradient-gold:linear-gradient(135deg,#D4AF37 0%,#E5C158 40%,#C89B3C 100%)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);min-height:100vh;padding-bottom:20px}
        .wrap{max-width:480px;margin:0 auto;padding:16px}
        .top-bar{display:flex;align-items:center;gap:14px;margin-bottom:24px;padding-top:8px}
        .back-btn{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none;font-size:18px;transition:all 0.2s}
        .back-btn:hover{background:var(--card)}
        .top-bar h1{font-size:20px;font-weight:800;color:var(--text)}
        .hero{background:var(--gradient-gold);border-radius:20px;padding:24px;color:#000;margin-bottom:24px;position:relative;overflow:hidden}
        .hero::before{content:'';position:absolute;width:160px;height:160px;background:radial-gradient(circle,rgba(0,0,0,0.06) 0%,transparent 70%);border-radius:50%;top:-60px;right:-40px}
        .hero-label{font-size:13px;font-weight:600;opacity:0.8;margin-bottom:4px}
        .hero-amount{font-size:32px;font-weight:900;letter-spacing:-0.02em}
        .hero-sub{font-size:13px;opacity:0.7;margin-top:4px}
        .section-label{font-size:14px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .section-label i{color:var(--gold)}
        .amount-input{width:100%;padding:16px 20px;border:2px solid var(--border);border-radius:14px;font-size:22px;font-weight:700;text-align:center;transition:all 0.3s;background:var(--surface);color:var(--text);outline:none}
        .amount-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,0.12)}
        .amount-input::placeholder{color:var(--muted);font-weight:500}
        .quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 24px}
        .quick-btn{padding:12px;border:2px solid var(--border);border-radius:12px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--surface);color:var(--text);font-weight:700;font-size:14px}
        .quick-btn:hover{border-color:var(--gold);background:var(--card)}
        .quick-btn.selected{border-color:var(--gold);background:var(--gradient-gold);color:#000}
        .summary{background:var(--card);border-radius:16px;padding:20px;border:1px solid var(--border);margin-bottom:20px;display:none}
        .summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
        .summary-row .lbl{color:var(--muted)}
        .summary-row .val{color:var(--text);font-weight:700}
        .summary-row.total{border-top:1px solid var(--border);margin-top:4px;padding-top:12px}
        .summary-row.total .val{color:var(--gold);font-size:16px}
        .pay-btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;transition:all 0.3s;background:var(--gradient-gold);color:#000;display:flex;align-items:center;justify-content:center;gap:10px}
        .pay-btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(212,175,55,0.25)}
        .pay-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed;transform:none;box-shadow:none}
        .secure-note{text-align:center;color:var(--muted);font-size:12px;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:6px}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:50000;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;display:none;max-width:90vw;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.3)}
        .toast.success{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);color:var(--success)}
        .toast.danger{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:var(--danger)}
        .toast.warning{background:rgba(245,158,11,0.15);border:1px solid rgba(245,158,11,0.3);color:var(--warning)}
        .loader-inline{display:none;text-align:center;padding:20px}
        .loader-inline .spin{width:36px;height:36px;border:3px solid rgba(212,175,55,0.15);border-left:3px solid var(--gold);border-radius:50%;animation:spinz 1s linear infinite;margin:0 auto 10px}
        @keyframes spinz{to{transform:rotate(360deg)}}
        .loader-inline p{color:var(--muted);font-size:14px}
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <div class="wrap">
        <div class="top-bar">
            <a href="{{ url_for('dashboard') }}" class="back-btn"><i class="fas fa-arrow-left"></i></a>
            <h1>Deposit</h1>
        </div>

        <div class="hero">
            <div class="hero-label">Current Balance</div>
            <div class="hero-amount">₦{{ "{:,.0f}".format(user.recharge_balance) }}</div>
            <div class="hero-sub">Available for investment</div>
        </div>

        <div class="section-label"><i class="fas fa-naira-sign"></i> Enter Amount</div>
        <input type="number" id="amount" class="amount-input" placeholder="Minimum ₦{{ "{:,.0f}".format(minimum_deposit|default(3000)) }}" min="{{ minimum_deposit|default(3000)|int }}" step="50" oninput="updateSummary()">

        <div class="quick-grid">
            <div class="quick-btn" onclick="selectAmount(3000,this)">₦3,000</div>
            <div class="quick-btn" onclick="selectAmount(5000,this)">₦5,000</div>
            <div class="quick-btn" onclick="selectAmount(7000,this)">₦7,000</div>
            <div class="quick-btn" onclick="selectAmount(8000,this)">₦8,000</div>
            <div class="quick-btn" onclick="selectAmount(9000,this)">₦9,000</div>
            <div class="quick-btn" onclick="selectAmount(10000,this)">₦10,000</div>
        </div>

        <div class="summary" id="summary">
            <div class="summary-row"><span class="lbl">Amount</span><span class="val" id="sumAmount">₦0</span></div>
            <div class="summary-row"><span class="lbl">Fee</span><span class="val">₦0</span></div>
            <div class="summary-row total"><span class="lbl">Total</span><span class="val" id="sumTotal">₦0</span></div>
        </div>

        <button class="pay-btn" id="payBtn" onclick="processPayment()" disabled>
            <i class="fas fa-lock"></i> Continue
        </button>

        <div id="loaderInline" class="loader-inline">
            <div class="spin"></div>
            <p id="loaderText">Processing...</p>
        </div>

        <div class="secure-note">
            <i class="fas fa-shield-alt"></i> Secured with 256-bit SSL encryption
        </div>
    </div>

    <script>
        const minDep = {{ minimum_deposit|default(3000)|int }};
        const maxDep = {{ maximum_deposit|default(10000)|int }};

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            t.style.display = 'block';
            clearTimeout(t._hide);
            t._hide = setTimeout(() => t.style.display = 'none', 3000);
        }

        function showInlineLoader(text) {
            document.getElementById('loaderText').textContent = text || 'Processing...';
            document.getElementById('loaderInline').style.display = 'block';
            document.getElementById('payBtn').style.display = 'none';
        }

        function hideInlineLoader() {
            document.getElementById('loaderInline').style.display = 'none';
            document.getElementById('payBtn').style.display = 'flex';
        }

        function selectAmount(amount, el) {
            if (maxDep && amount > maxDep) {
                showToast('Maximum is ₦' + maxDep.toLocaleString(), 'warning');
                return;
            }
            document.querySelectorAll('.quick-btn').forEach(b => b.classList.remove('selected'));
            if (el) el.classList.add('selected');
            document.getElementById('amount').value = amount;
            updateSummary();
        }

        function updateSummary() {
            const amt = parseFloat(document.getElementById('amount').value) || 0;
            const ok = amt >= minDep && (!maxDep || amt <= maxDep);
            document.getElementById('payBtn').disabled = !ok;
            document.getElementById('summary').style.display = ok ? 'block' : 'none';
            if (ok) {
                document.getElementById('sumAmount').textContent = '₦' + amt.toLocaleString();
                document.getElementById('sumTotal').textContent = '₦' + amt.toLocaleString();
            }
        }

        function processPayment() {
            const amt = parseFloat(document.getElementById('amount').value);
            if (!amt || amt < minDep) {
                showToast('Minimum deposit is ₦' + minDep.toLocaleString(), 'warning');
                return;
            }
            if (maxDep && amt > maxDep) {
                showToast('Maximum deposit is ₦' + maxDep.toLocaleString(), 'warning');
                return;
            }
            if (!confirm('Proceed with payment of ₦' + amt.toLocaleString() + '?')) return;
            showInlineLoader('Creating payment request...');
            document.getElementById('payBtn').disabled = true;
            const fd = new FormData();
            fd.append('amount', amt);
            fd.append('payment_method', 'nekpayment');
            fetch('/process_deposit', { method: 'POST', body: fd })
                .then(r => r.json())
                .then(d => {
                    if (d.success) {
                        if (d.payment_url) {
                            showInlineLoader('Opening payment page...');
                            setTimeout(() => { window.location.href = d.payment_url; }, 300);
                        } else {
                            showToast('Deposit successful! ₦' + amt.toLocaleString() + ' added', 'success');
                            setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
                        }
                    } else {
                        hideInlineLoader();
                        document.getElementById('payBtn').disabled = false;
                        showToast(d.message || 'Payment failed', 'danger');
                    }
                })
                .catch(() => {
                    hideInlineLoader();
                    document.getElementById('payBtn').disabled = false;
                    showToast('Network error. Please try again.', 'danger');
                });
        }

        document.addEventListener('DOMContentLoaded', updateSummary);
    </script>
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
