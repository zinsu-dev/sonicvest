<style>
  .bottom-spacer {
    height: 84px;
    width: 100%;
    display: block;
  }
  .bottom {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 10px;
    padding: 0 16px;
    display: flex;
    justify-content: center;
    pointer-events: auto;
    z-index: var(--z-nav, 1000);
  }
  .bwrap {
    width: 100%;
    max-width: 400px;
    padding: 5px 6px;
    background: var(--surface, #18181B);
    border-radius: var(--r-xl, 18px);
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border: 1px solid var(--border, #27272A);
  }
  .bitem {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: var(--gray-400, #71717A);
    gap: 2px;
    padding: 7px 10px;
    border-radius: var(--r-md, 10px);
    transition: all 0.18s ease;
    position: relative;
  }
  .bitem:hover {
    color: var(--primary, #D4AF37);
  }
  .bitem.active {
    color: var(--primary, #D4AF37);
    background: var(--primary-subtle, rgba(212,175,55,0.05));
  }
  .bitem i, .bitem svg {
    width: 20px;
    height: 20px;
    stroke-width: 2;
  }
  .bitem small {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  @supports (padding: env(safe-area-inset-bottom)) {
    .bottom {
      bottom: calc(10px + env(safe-area-inset-bottom));
    }
    .bottom-spacer {
      height: calc(84px + env(safe-area-inset-bottom));
    }
  }
</style>
<div class="bottom-spacer" aria-hidden="true"></div>
<div class="bottom">
  <nav class="bwrap" aria-label="Main navigation">
    <a href="{{ url_for('dashboard') }}" class="bitem {% if active=='dashboard' %}active{% endif %}" aria-label="Home">
      <i data-lucide="home"></i>
      <small>Home</small>
    </a>
    <a href="{{ url_for('packages') }}" class="bitem {% if active=='packages' %}active{% endif %}" aria-label="Plans">
      <i data-lucide="layers"></i>
      <small>Plans</small>
    </a>
    <a href="{{ url_for('deposit') }}" class="bitem {% if active=='deposit' %}active{% endif %}" aria-label="Deposit">
      <i data-lucide="plus-circle"></i>
      <small>Deposit</small>
    </a>
    <a href="{{ url_for('referral') }}" class="bitem {% if active=='referral' %}active{% endif %}" aria-label="Team">
      <i data-lucide="users"></i>
      <small>Team</small>
    </a>
    <a href="{{ url_for('profile') }}" class="bitem {% if active=='profile' %}active{% endif %}" aria-label="Profile">
      <i data-lucide="user"></i>
      <small>Profile</small>
    </a>
  </nav>
</div>
<script>if(typeof lucide!=='undefined')lucide.createIcons();</script>
