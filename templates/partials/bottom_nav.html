<style>
  .bottom-spacer{height:90px;width:100%;display:block}
  .bottom{position:fixed;left:0;right:0;bottom:16px;padding:0 12px;display:flex;justify-content:center;pointer-events:auto;z-index:1200}
  .bwrap{width:100%;max-width:520px;padding:8px 12px;background:#20232A;border-radius:20px;display:flex;justify-content:space-around;box-shadow:0 8px 32px rgba(0,0,0,0.4);border:1px solid #2C313A}
  .bitem{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#B3B8C4;gap:4px;padding:8px 14px;border-radius:12px;transition:all 0.2s ease}
  .bitem.active{color:#D4AF37;background:rgba(212,175,55,0.1)}
  .bitem:hover{color:#D4AF37}
  .bitem i{font-size:18px}
  .bitem small{font-size:10px;font-weight:600}
  @supports(padding:env(safe-area-inset-bottom)){.bottom{bottom:calc(16px + env(safe-area-inset-bottom))}.bottom-spacer{height:calc(90px + env(safe-area-inset-bottom))}}
</style>
<div class="bottom-spacer" aria-hidden="true"></div>
<div class="bottom">
  <nav class="bwrap">
    <a href="{{ url_for('dashboard') }}" class="bitem {% if active=='dashboard' %}active{% endif %}"><i class="fas fa-home"></i><small>Home</small></a>
    <a href="{{ url_for('packages') }}" class="bitem {% if active=='packages' %}active{% endif %}"><i class="fas fa-layer-group"></i><small>Plans</small></a>
    <a href="{{ url_for('deposit') }}" class="bitem {% if active=='deposit' %}active{% endif %}"><i class="fas fa-plus-circle"></i><small>Deposit</small></a>
    <a href="{{ url_for('referral') }}" class="bitem {% if active=='referral' %}active{% endif %}"><i class="fas fa-users"></i><small>Team</small></a>
    <a href="{{ url_for('profile') }}" class="bitem {% if active=='profile' %}active{% endif %}"><i class="fas fa-user"></i><small>Profile</small></a>
  </nav>
</div>
