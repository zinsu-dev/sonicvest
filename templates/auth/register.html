{% extends "base.html" %}

{% block title %}Register - Brooklyn{% endblock %}

{% block styles %}
<style>
  body > main:first-of-type { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card animate-fade-in">
    <div class="auth-header">
      <div class="auth-logo">S</div>
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Start your investment journey</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-input" placeholder="Enter your full name" value="{{ request.form.get('name','') }}" autocomplete="name" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" value="{{ request.form.get('email','') }}" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-input" placeholder="08012345678" value="{{ request.form.get('phone','') }}" autocomplete="tel" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="referral_code">Referral Code (Optional)</label>
        <input type="text" id="referral_code" name="referral_code" class="form-input" placeholder="Enter referral code" value="{{ request.form.get('referral_code','') }}">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <input type="password" id="password" name="password" class="form-input" placeholder="Create a strong password" autocomplete="new-password" required>
          <button type="button" class="input-toggle" id="passwordToggle" aria-label="Toggle password visibility">
            <i data-lucide="eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a href="{{ url_for('login') }}" class="auth-link">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  lucide.createIcons();
  (function(){
    var toggle = document.getElementById('passwordToggle');
    var input = document.getElementById('password');
    if(toggle && input){
      toggle.addEventListener('click',function(){
        var type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
        var icon = toggle.querySelector('[data-lucide]');
        if(icon){
          icon.setAttribute('data-lucide', type === 'password' ? 'eye' : 'eye-off');
          lucide.createIcons();
        }
      });
    }
    document.getElementById('name')?.focus();
  })();
</script>
{% endblock %}
