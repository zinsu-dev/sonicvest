{% extends "base.html" %}

{% block title %}Register - Brooklyn{% endblock %}

{% block styles %}
<style>
  body > main:first-of-type { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card animate-fade-in">
    <div class="auth-header">
      <div class="auth-logo">S</div>
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Start your investment journey</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name" value="{{ request.form.get('name','') }}" autocomplete="name" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" value="{{ request.form.get('email','') }}" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" class="form-control" placeholder="08012345678" value="{{ request.form.get('phone','') }}" autocomplete="tel" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="referral_code">Referral Code (Optional)</label>
        <input type="text" id="referral_code" name="referral_code" class="form-control" placeholder="Enter referral code" value="{{ request.form.get('referral_code','') }}">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-input-group">
          <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" autocomplete="new-password" required>
        </div>
      </div>

      <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <div class="auth-footer">
      <span style="color:var(--text-muted);font-size:14px;">Already have an account?</span>
      <a href="{{ url_for('login') }}" class="auth-link" style="margin-left:4px;">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function(){ document.getElementById('name')?.focus(); });
</script>
{% endblock %}
