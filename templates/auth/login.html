{% extends "base.html" %}

{% block title %}Login - Brooklyn{% endblock %}

{% block styles %}
<style>
  body > main:first-of-type { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card animate-fade-in">
    <div class="auth-header">
      <div class="auth-logo">S</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account</p>
    </div>

    <form method="POST" id="loginForm">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="text" id="email" name="email" class="form-control" placeholder="you@example.com" value="{{ request.form.get('email', '') }}" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-input-group">
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <div class="auth-footer">
      <span style="color:var(--text-muted);font-size:14px;">Don't have an account?</span>
      <a href="{{ url_for('register') }}" class="auth-link" style="margin-left:4px;">Create account</a>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  (function(){
    var toggle = document.getElementById('passwordToggle');
    var input = document.getElementById('password');
    if(toggle && input){
      toggle.addEventListener('click',function(){
        var type = input.getAttribute('type') === 'password' ? 'text' : 'password';
        input.setAttribute('type', type);
        this.querySelector('i').classList.toggle('fa-eye');
        this.querySelector('i').classList.toggle('fa-eye-slash');
      });
    }
    document.getElementById('email')?.focus();
  })();
</script>
{% endblock %}
